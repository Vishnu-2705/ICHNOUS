version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tracemind-postgres
    environment:
      POSTGRES_DB: tracemind
      POSTGRES_USER: tracemind_user
      POSTGRES_PASSWORD: tracemind_password
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracemind_user -d tracemind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tracemind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  phoenix:
    image: arize-phoenix:latest
    container_name: tracemind-phoenix
    ports:
      - "6006:6006"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      PHOENIX_PORT: 6006
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6006/"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tracemind-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://tracemind_user:tracemind_password@postgres:5432/tracemind
      - REDIS_URL=redis://redis:6379/0
      - PHOENIX_URL=http://phoenix:6006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracemind-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
